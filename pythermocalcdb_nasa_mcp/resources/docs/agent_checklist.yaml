resource: pythermocalcdb-nasa://guidance/agent-checklist
purpose: >
  Provide concise operational rules for agents using PyThermoCalcDB-NASA-MCP.

before_any_tool_call:
  - Read the relevant workflow resource.
  - Use source: database first for NASA-9 data available in the embedded SQLite database.
  - Use source: reference only when complete external REFERENCE content has already been prepared.
  - Do not search external data from this MCP server.
  - Do not invent component properties, NASA coefficients, or temperature ranges.
  - Use check_yaml_reference when external reference YAML validity is uncertain.
  - Use K for temperature.unit.

species_calculation_checklist:
  - Select one of calc_H_T, calc_S_T, calc_G_T, or calc_Cp_T.
  - Provide component.name, component.formula, and component.state.
  - Use basis: molar unless the user explicitly asks for mass basis.
  - For mass basis, confirm MW is present.
  - For source: reference, confirm requested temperature is within Tmin/Tmax.

reaction_calculation_checklist:
  - Select one of calc_dH_rxn_STD, calc_dS_rxn_STD, calc_dG_rxn_STD, calc_Keq, or calc_Keq_vh_shortcut.
  - Use calc_Keq_vh_shortcut only when a van't Hoff shortcut estimate is requested.
  - Ensure the reaction equation uses state-qualified species, for example CO(g).
  - Ensure components includes every reactant and product.
  - Use source: database first for supported g, l, and s phases.
  - For source: reference, ensure all reaction species exist in reference_content.
  - Confirm requested temperature is within Tmin/Tmax for every species.

response_handling:
  success_true:
    - Read results.value and results.unit.
    - Include warnings when reporting boundary or diagnostic information.
  success_false:
    - Do not report a numerical result.
    - Use message as the main failure reason.
    - Use warnings as concrete corrections for the next call.

situational_guidance:
  database_missing_component:
    action: "Explain that another agent or caller must prepare REFERENCE content, then retry with source: reference."
  user_requests_temperature_outside_range:
    action: "Return or explain the structured failure unless another valid reference table is supplied."
  user_omits_reference_content:
    action: "Use source: database unless the user explicitly requested external reference data."
  user_asks_mcp_to_search_external_data:
    action: "Explain that external searching is outside MCP scope; another agent must create REFERENCE content."
  user_requests_pressure_dependent_property:
    action: "Explain that the exposed NASA methods do not accept pressure."
  user_requests_unknown_species:
    action: "Try source: database first; if missing, require externally prepared REFERENCE content."
