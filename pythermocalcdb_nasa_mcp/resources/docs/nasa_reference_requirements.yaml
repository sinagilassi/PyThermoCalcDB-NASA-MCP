resource: pythermocalcdb-nasa://references/nasa-requirements
purpose: >
  Explain how model-source data is selected before an agent calls any
  PyThermoCalcDB-NASA-MCP calculation tool.

source_policy:
  default_source: database
  database_source: >
    The MCP wrapper first uses the embedded NASA-9 SQLite database through
    pythermocalcdb_nasa.check_component_availability and
    pythermocalcdb_nasa.build_model_source_from_database.
  reference_source: >
    Use source: reference only when an external agent or caller has prepared
    complete pyThermoDB YAML REFERENCE content.
  external_search_boundary: >
    This MCP server does not search external scientific data sources, infer
    missing coefficients, or create REFERENCE content from the internet.

reference_content_contract:
  required_when: source is reference
  format: pyThermoDB YAML string
  root_required_key: REFERENCES
  expected_table_family: NASA polynomial data
  caller_responsibility:
    - Provide complete reference_content when source is reference.
    - Do not ask the LLM to invent missing thermodynamic coefficients.
    - Use check_yaml_reference first when external YAML structure is uncertain.

component_identity:
  required_fields:
    - name
    - formula
    - state
  database_state_values:
    - g
    - l
    - s
  reference_state_values:
    - g
    - l
    - s
    - aq
  matching_rule: >
    Database matching checks name and falls back to formula. Reference matching
    requires the requested component identity to match the prepared reference rows.

required_symbols:
  nasa9_molar:
    - a1
    - a2
    - a3
    - a4
    - a5
    - a6
    - a7
    - b1
    - b2
  nasa7_molar:
    - a1
    - a2
    - a3
    - a4
    - a5
    - a6
    - a7
  mass_basis_extra:
    - MW
  range_validation:
    - Tmin
    - Tmax

temperature_policy:
  accepted_unit: K
  strict_range_check: true
  database_range_selection: >
    The database builder selects one NASA-9 range for each component using the
    requested calculation temperature.
  behavior: >
    The MCP wrapper returns success: false when the requested temperature is
    outside Tmin/Tmax for any required component. It does not extrapolate NASA
    polynomials.

common_failures:
  database_missing_component:
    symptom: success is false and message mentions the embedded NASA-9 database.
    correction: "Have another agent prepare REFERENCE content, then retry with source: reference."
  invalid_yaml:
    symptom: success is false and message mentions YAML parsing.
    correction: "Repair reference_content syntax before retrying with source: reference."
  missing_component:
    symptom: success is false and message mentions ModelSource construction.
    correction: Ensure name, formula, and state match a database row or reference row.
  missing_symbols:
    symptom: success is false and warnings list missing symbols.
    correction: Provide a NASA table containing all required symbols.
  out_of_range_temperature:
    symptom: success is false and warnings list supported Tmin/Tmax.
    correction: Use a temperature inside the selected range or supply another reference table.

agent_boundaries:
  no_external_search_in_mcp: >
    If database data is unavailable, this MCP returns diagnostics. Another
    agent may search external sources and create REFERENCE content.
  no_coefficient_guessing: >
    Do not infer, approximate, or repair NASA coefficients inside MCP requests.
  deterministic_scope: >
    The MCP layer validates and orchestrates. pythermocalcdb-nasa owns the
    thermodynamic calculation.
