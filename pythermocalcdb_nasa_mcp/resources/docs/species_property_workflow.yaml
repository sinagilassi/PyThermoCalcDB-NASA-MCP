resource: pythermocalcdb-nasa://workflows/species-properties
purpose: >
  Guide agents through single-species NASA property calculations.

available_tools:
  calc_H_T:
    result: enthalpy
    typical_unit: J/mol for molar basis
  calc_S_T:
    result: entropy
    typical_unit: J/mol.K for molar basis
  calc_G_T:
    result: Gibbs free energy
    typical_unit: J/mol for molar basis
  calc_Cp_T:
    result: heat capacity
    typical_unit: J/mol.K for molar basis

request_shape:
  database_default:
    request:
      component:
        name: carbon dioxide
        formula: CO2
        state: g
      temperature:
        value: 300.0
        unit: K
      source: database
      component_key: Name-Formula
      nasa_type: nasa9
      basis: molar
  reference_fallback:
    request:
      component:
        name: component name from prepared reference
        formula: Formula
        state: g
      temperature:
        value: 300.0
        unit: K
      source: reference
      reference_content: "REFERENCES: ..."
      component_key: Name-Formula
      nasa_type: nasa9
      basis: molar

decision_rules:
  source:
    default: database
    reference_when: Embedded NASA-9 database reports missing component data and a caller has prepared REFERENCE content.
    never_do: Do not search external scientific data from the MCP server.
  property_selection:
    enthalpy: calc_H_T
    entropy: calc_S_T
    gibbs_free_energy: calc_G_T
    heat_capacity: calc_Cp_T
  component_key:
    default: Name-Formula
    change_only_if: The supplied reference/model workflow requires another pyThermoLinkDB key.
  nasa_type:
    database_default: nasa9
    nasa9_requires: a1-a7, b1, b2
    nasa7_requires: "a1-a7 and source: reference"
  basis:
    default: molar
    mass_basis_requires: MW

agent_workflow:
  - Read pythermocalcdb-nasa://references/nasa-requirements.
  - Build a Component with exact name, formula, and state.
  - Use source: database first unless the caller already supplied external REFERENCE content.
  - Confirm temperature.unit is K.
  - Call the property-specific tool.
  - If database data is missing, ask another agent or caller to prepare REFERENCE content and retry with source: reference.
  - If success is false, use message and warnings to correct the next request.
  - Report results.value with results.unit.

agent_boundaries:
  database_source: embedded NASA-9 SQLite database
  reference_content_source: externally prepared by caller or another agent
  external_search: >
    Searching external data is not the MCP server's duty.
  invalid_or_missing_data: >
    Return the structured failure to the user and explain which required
    component, symbol, or temperature range is missing.
